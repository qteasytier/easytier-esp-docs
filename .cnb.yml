# .cnb.yml
"**":
  push:
    - name: sync to github
      imports:
        - https://cnb.cool/myqfeng/keys/-/blob/main/github.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/qteasytier/easytier-esp-docs.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            push_tags: true
            force: true